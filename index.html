<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>El Impostor</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="Impostor.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>

    <section id="setup">
        <h1>Impostor</h1>

        <label>
            Cantidad de jugadores
            <input type="number" id="playersInput" min="3" value="5">
        </label>

        <div id="playersNames"></div>

        <label>
            Tiempo de ronda (seg)
            <input type="number" id="timeInput" value="60">
        </label>

        <label>
            Categoría
            <select id="categorySelect">
                <option value="argentina">🇦🇷 Argentina</option>
                <option value="famosos">⭐ Famosos</option>
                <option value="cantantes">🎤 Cantantes</option>
                <option value="futbol">⚽ Jugadores de fútbol</option>
            </select>
        </label>

        <button id="startBtn">Iniciar juego</button>

    </section>

    <section id="words" class="hidden">
        <h2 id="playerTitle"></h2>

        <div id="card" class="card">
            <div class="card-inner">
                <div class="card-front">
                    Tocá para ver tu palabra
                </div>
                <div class="card-back" id="cardBack"></div>
            </div>
        </div>

        <button id="nextBtn">Siguiente jugador</button>
    </section>


    <section id="round" class="hidden">
        <h2>Ronda en curso</h2>
        <div id="timer"></div>
        <button id="goVoteBtn" class="secondary">Ir a votación</button>
    </section>

    <section id="voting" class="hidden">
        <h2>¿Quién es el impostor?</h2>
        <div id="votes" class="vote-list"></div>
        <button id="finishVoteBtn">Confirmar voto</button>
    </section>


    <script src="game.js"></script>
</body>

</html>
